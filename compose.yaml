services:
  postgres:
    image: postgres:16-alpine
    container_name: gamepickup-postgres
    environment:
      POSTGRES_DB: gamepickup
      POSTGRES_USER: gamepickup
      POSTGRES_PASSWORD: gamepickup_dev
    ports:
      - "5432:5432"
    volumes:
      - gamepickup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamepickup -d gamepickup"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 로컬 통합 개발용 API. 운영에서는 같은 이미지를 Railway/ECS에 배포하고
  # DATABASE_URL만 관리형 PostgreSQL 주소로 교체한다.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: development
      DATABASE_URL: postgresql+psycopg://gamepickup:gamepickup_dev@postgres:5432/gamepickup
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000,http://localhost:8081,http://127.0.0.1:8081
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 개발 환경에서는 비워 두어도 서버가 시작된다. 관리자 로그인이 필요하면
      # server/scripts/make_password_hash.py로 생성한 값을 셸 또는 .env에서 주입한다.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:-compose-development-only-change-me}
      INGEST_API_KEY: ${INGEST_API_KEY:-compose-development-ingest-key}
      EXPO_PUSH_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      MEDIA_DIR: /data/media
      ADMIN_DIST_DIR: /app/admin-dist
      PRIVACY_CONTACT_EMAIL: dev@example.invalid
    ports:
      - "8000:8000"
    volumes:
      - gamepickup-api-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 자동 수집이 필요할 때만 켠다. 첫 출시는 관리자 수동 등록으로 운영한다.
  collector:
    profiles: ["collector"]
    build:
      context: .
      dockerfile: Dockerfile.collector
    environment:
      INGEST_SERVER_URL: http://api:8000
      INGEST_API_KEY: compose-development-ingest-key
    depends_on:
      api:
        condition: service_healthy

volumes:
  gamepickup-postgres-data:
  gamepickup-api-data:
