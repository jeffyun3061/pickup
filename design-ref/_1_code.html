<style>
        .grid-pattern {
            background-image: linear-gradient(rgba(255, 215, 0, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 215, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        @media (min-width: 768px) {
            .grid-pattern {
                background-size: 40px 40px;
            }
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.4);
        }
        
        .box-glow {
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        /* Loading Bar Animation */
        @keyframes loading-progress {
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; }
        }
        
        .animate-loading {
            animation: loading-progress 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Glitch Animation */
        @keyframes glitch-anim {
            0% { clip: rect(44px, 9999px, 8px, 0); }
            20% { clip: rect(51px, 9999px, 86px, 0); }
            40% { clip: rect(69px, 9999px, 66px, 0); }
            60% { clip: rect(87px, 9999px, 93px, 0); }
            80% { clip: rect(6px, 9999px, 14px, 0); }
            100% { clip: rect(13px, 9999px, 46px, 0); }
        }
        
        .glitch-effect {
            position: relative;
        }
        
        .glitch-effect::before,
        .glitch-effect::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        
        .glitch-effect::before {
            left: 2px;
            text-shadow: -1px 0 rgba(208, 91, 255, 0.8);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }
        
        .glitch-effect::after {
            left: -2px;
            text-shadow: -1px 0 rgba(255, 215, 0, 0.8);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
    </style>
